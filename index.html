<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣獨立書店地圖 | 巷弄裡的紙本溫度</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-paper: #FAF7F2;
      --bg-card: #FFFFFF;
      --text-main: #2C2621;
      --text-muted: #796E65;
      --border-color: #E8E2D9;
      --accent: #B3541E;
      --accent-hover: #964213;
      --sidebar-width: 400px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Noto Sans TC', sans-serif;
      color: var(--text-main);
      background-color: var(--bg-paper);
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-paper);
      border-right: 1px solid var(--border-color);
      box-shadow: 2px 0 12px rgba(44, 38, 33, 0.04);
      z-index: 1000;
    }

    .header-panel {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-paper);
    }

    .brand-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: var(--bg-card);
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .search-input:focus { border-color: var(--accent); }

    .city-select {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .random-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .random-btn:hover { background: var(--accent-hover); }

    .stats-bar {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 座標校正狀態條 */
    #geocodeStatus {
      font-size: 11px;
      color: var(--accent);
      background: #FDF3ED;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }

    #store-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .store-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .store-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(44, 38, 33, 0.06);
    }

    .store-card.active {
      border-color: var(--accent);
      background: #FFFDF9;
      box-shadow: 0 0 0 2px rgba(179, 84, 30, 0.2);
    }

    .card-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .card-city {
      font-size: 11px;
      padding: 2px 6px;
      background: #EFEBE4;
      color: var(--text-muted);
      border-radius: 4px;
    }

    .card-calibrated {
      font-size: 10px;
      padding: 2px 6px;
      background: #EAF4EC;
      color: #2E7D32;
      border-radius: 4px;
    }

    .card-address {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .card-time { font-size: 12px; color: #92857A; }

    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .status-icon { font-size: 32px; }

    .retry-btn {
      margin-top: 8px;
      padding: 8px 18px;
      background: var(--text-main);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    #map { flex: 1; height: 100%; }

    .leaflet-tile-pane {
      filter: saturate(0.85) sepia(0.08) contrast(0.95);
    }

    .leaflet-popup-content-wrapper {
      background: var(--bg-paper);
      color: var(--text-main);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(44, 38, 33, 0.15);
      border: 1px solid var(--border-color);
      font-family: 'Noto Sans TC', sans-serif;
      max-width: 300px;
    }

    .leaflet-popup-content { margin: 14px 16px; line-height: 1.5; }
    .popup-img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
    .popup-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .popup-info { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .popup-intro {
      font-size: 12px;
      color: var(--text-main);
      margin-top: 8px;
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 50vh; }
      #map { height: 50vh; }
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="header-panel">
      <div class="brand-title">
        <span>📖</span> 全台獨立書店地圖
      </div>
      <div class="brand-subtitle">拾起一本書，走進巷弄裡的專注時刻</div>

      <div class="controls">
        <div class="search-row">
          <input type="text" id="searchInput" class="search-input" placeholder="搜尋書店名稱或地址..." />
          <select id="citySelect" class="city-select">
            <option value="all">全台灣</option>
          </select>
        </div>
        <button id="randomBtn" class="random-btn">
          <span>✨</span> 遇見下一間書店（漫遊）
        </button>
      </div>

      <div class="stats-bar">
        <span id="resultCount">載入中...</span>
        <span id="geocodeStatus">正在校正座標...</span>
      </div>
    </div>

    <div id="store-list"></div>
  </aside>

  <div id="map"></div>

  <!-- Leaflet JS & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const DATA_URL = './emapOpenDataAction.json';
    const CACHE_STORAGE_KEY = 'GEOCODE_CACHE_V1';

    let allStores = [];
    let filteredStores = [];
    let markersMap = new Map();

    // 1. 初始化地圖
    const map = L.map('map', { zoomControl: true }).setView([23.8, 120.9], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者',
      maxZoom: 19
    }).addTo(map);

    const markerClusterGroup = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 40
    });
    map.addLayer(markerClusterGroup);

    // DOM 節點
    const listContainer = document.getElementById('store-list');
    const searchInput = document.getElementById('searchInput');
    const citySelect = document.getElementById('citySelect');
    const randomBtn = document.getElementById('randomBtn');
    const resultCount = document.getElementById('resultCount');
    const geocodeStatus = document.getElementById('geocodeStatus');

    // 2. 本地快取讀取與寫入
    function getGeocodeCache() {
      try {
        return JSON.parse(localStorage.getItem(CACHE_STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveGeocodeCache(cache) {
      try {
        localStorage.setItem(CACHE_STORAGE_KEY, JSON.stringify(cache));
      } catch (e) {
        console.warn('快取寫入失敗（可能超過儲存上限）');
      }
    }

    // 3. 獲取本地 JSON 資料並檢查假座標
    async function loadBookstores() {
      renderLoading();
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`無法讀取檔案 (${response.status})`);
        const data = await response.json();

        const geoCache = getGeocodeCache();

        // 統計座標重複次數，辨識哪些是「公版假經緯度」
        const coordCount = new Map();
        data.forEach(item => {
          if (item.latitude && item.longitude) {
            const key = `${parseFloat(item.latitude).toFixed(4)},${parseFloat(item.longitude).toFixed(4)}`;
            coordCount.set(key, (coordCount.get(key) || 0) + 1);
          }
        });

        const geocodeQueue = [];

        allStores = data
          .filter(item => (item.latitude && item.longitude) || item.address)
          .map((item, index) => {
            let rawCity = (item.cityName || '').trim();
            let cleanCity = rawCity.substring(0, 3) || '其他';
            
            let lat = parseFloat(item.latitude);
            let lng = parseFloat(item.longitude);
            let isSuspicious = false;

            const coordKey = (!isNaN(lat) && !isNaN(lng)) 
              ? `${lat.toFixed(4)},${lng.toFixed(4)}` 
              : 'missing';

            // 若無經緯度，或該座標出現超過 1 次，判定為公版中心點假座標
            if (isNaN(lat) || isNaN(lng) || (coordCount.get(coordKey) || 0) > 1) {
              isSuspicious = true;
            }

            const cacheKey = `${cleanCity}_${item.address}`;
            let calibrated = false;

            // 優先讀取先前已轉換過的本地快取
            if (geoCache[cacheKey]) {
              lat = geoCache[cacheKey].lat;
              lng = geoCache[cacheKey].lng;
              calibrated = true;
              isSuspicious = false;
            }

            const store = {
              id: index,
              name: item.name || '未命名書店',
              cityName: cleanCity,
              address: item.address || '無地址資料',
              openTime: item.openTime || '無營業時間資訊',
              intro: item.intro || '',
              phone: item.phone || '',
              image: item.representImage || '',
              lat: lat,
              lng: lng,
              calibrated: calibrated
            };

            // 如果仍屬於可疑假座標，加入背景校正佇列
            if (isSuspicious && store.address && store.address !== '無地址資料') {
              geocodeQueue.push(store);
            }

            return store;
          });

        buildCityFilter();
        applyFilter();

        // 背景啟動逐一校正程序
        if (geocodeQueue.length > 0) {
          processGeocodeQueue(geocodeQueue);
        }
      } catch (error) {
        console.error('資料載入失敗:', error);
        renderError();
      }
    }

    // 4. 背景非同步轉換地址至精準座標（呼叫 Nominatim API）
    async function processGeocodeQueue(queue) {
      geocodeStatus.style.display = 'inline-block';
      const cache = getGeocodeCache();
      let remaining = queue.length;

      for (const store of queue) {
        geocodeStatus.textContent = `校正假座標中 (${remaining} 剩餘)...`;

        // 過濾樓層字眼，提升 OSM 地址匹配率
        const cleanAddr = store.address.replace(/(?:\d+樓|\d+F|[A-Za-z]\d*樓|地下\d+層|B\d+)/gi, '').trim();
        const query = `${store.cityName} ${cleanAddr}`.replace(/\s+/g, ' ');

        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
          const res = await fetch(url);
          const results = await res.json();

          if (results && results.length > 0) {
            const newLat = parseFloat(results[0].lat);
            const newLng = parseFloat(results[0].lon);

            // 更新記憶體中的店鋪物件
            store.lat = newLat;
            store.lng = newLng;
            store.calibrated = true;

            // 儲存至本地快取
            const cacheKey = `${store.cityName}_${store.address}`;
            cache[cacheKey] = { lat: newLat, lng: newLng };
            saveGeocodeCache(cache);

            // 動態更新地圖上的 Marker 位置
            const marker = markersMap.get(store.id);
            if (marker) {
              marker.setLatLng([newLat, newLng]);
            }

            // 更新側邊欄標籤
            const cardBadge = document.querySelector(`#card-${store.id} .card-calibrated`);
            if (!cardBadge) {
              const tagsContainer = document.querySelector(`#card-${store.id} .card-tags`);
              if (tagsContainer) {
                const b = document.createElement('span');
                b.className = 'card-calibrated';
                b.textContent = '📍 座標精確';
                tagsContainer.appendChild(b);
              }
            }
          }
        } catch (e) {
          console.warn(`地址解析失敗 [${store.name}]:`, e);
        }

        remaining--;
        // 嚴格遵守 OSM 規範：間隔 1.1 秒避免被拒絕服務
        await new Promise(r => setTimeout(r, 1100));
      }

      geocodeStatus.textContent = '✓ 座標校正完畢';
      setTimeout(() => { geocodeStatus.style.display = 'none'; }, 3000);
    }

    // 建立縣市下拉選單
    function buildCityFilter() {
      const cities = Array.from(new Set(allStores.map(s => s.cityName))).filter(Boolean).sort();
      citySelect.innerHTML = '<option value="all">全台灣</option>';
      cities.forEach(city => {
        const opt = document.createElement('option');
        opt.value = city;
        opt.textContent = city;
        citySelect.appendChild(opt);
      });
    }

    // 5. 搜尋與地區過濾
    function applyFilter() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedCity = citySelect.value;

      filteredStores = allStores.filter(store => {
        const hasValidCoords = !isNaN(store.lat) && !isNaN(store.lng);
        const matchCity = (selectedCity === 'all') || (store.cityName === selectedCity);
        const matchKeyword = (!keyword) || 
          store.name.toLowerCase().includes(keyword) || 
          store.address.toLowerCase().includes(keyword);
        return hasValidCoords && matchCity && matchKeyword;
      });

      resultCount.textContent = `共收錄 ${filteredStores.length} 間書店`;
      renderMapMarkers();
      renderStoreList();
    }

    // 6. 渲染地圖標記點
    function renderMapMarkers() {
      markerClusterGroup.clearLayers();
      markersMap.clear();

      filteredStores.forEach(store => {
        const marker = L.marker([store.lat, store.lng]);

        const imageHTML = store.image ? `<img src="${escapeHTML(store.image)}" class="popup-img" alt="${escapeHTML(store.name)}" onerror="this.style.display='none'">` : '';
        const phoneHTML = store.phone ? `<div class="popup-info">📞 ${escapeHTML(store.phone)}</div>` : '';

        const popupContent = `
          ${imageHTML}
          <div class="popup-title">${escapeHTML(store.name)}</div>
          <div class="popup-info">📍 ${escapeHTML(store.address)}</div>
          <div class="popup-info">⏰ ${escapeHTML(store.openTime)}</div>
          ${phoneHTML}
          ${store.intro ? `<div class="popup-intro">${escapeHTML(store.intro)}</div>` : ''}
        `;
        marker.bindPopup(popupContent);

        marker.on('click', () => {
          highlightCard(store.id);
        });

        markerClusterGroup.addLayer(marker);
        markersMap.set(store.id, marker);
      });
    }

    // 7. 渲染側邊欄清單
    function renderStoreList() {
      listContainer.innerHTML = '';

      if (filteredStores.length === 0) {
        listContainer.innerHTML = `
          <div class="status-container">
            <div class="status-icon">🍃</div>
            <p>沒有找到符合條件的書店</p>
          </div>
        `;
        return;
      }

      filteredStores.forEach(store => {
        const card = document.createElement('div');
        card.className = 'store-card';
        card.id = `card-${store.id}`;
        card.innerHTML = `
          <div class="card-title">${escapeHTML(store.name)}</div>
          <div class="card-tags">
            <span class="card-city">${escapeHTML(store.cityName)}</span>
            ${store.calibrated ? '<span class="card-calibrated">📍 座標精確</span>' : ''}
          </div>
          <div class="card-address">${escapeHTML(store.address)}</div>
          <div class="card-time">營業時間：${escapeHTML(store.openTime)}</div>
        `;

        card.addEventListener('click', () => {
          focusStoreOnMap(store.id);
        });

        listContainer.appendChild(card);
      });
    }

    function focusStoreOnMap(storeId) {
      const store = allStores.find(s => s.id === storeId);
      const marker = markersMap.get(storeId);
      if (!store || !marker) return;

      highlightCard(storeId);
      map.flyTo([store.lat, store.lng], 16, { duration: 1.2 });
      markerClusterGroup.zoomToShowLayer(marker, () => {
        marker.openPopup();
      });
    }

    function highlightCard(storeId) {
      document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${storeId}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function triggerRandomStore() {
      const pool = filteredStores.length > 0 ? filteredStores : allStores;
      if (pool.length === 0) return;

      const randomIndex = Math.floor(Math.random() * pool.length);
      const randomStore = pool[randomIndex];
      focusStoreOnMap(randomStore.id);
    }

    function renderLoading() {
      resultCount.textContent = '載入中...';
      listContainer.innerHTML = `
        <div class="status-container">
          <div class="status-icon">🍵</div>
          <p>正在載入書店清單...</p>
        </div>
      `;
    }

    function renderError() {
      resultCount.textContent = '載入失敗';
      listContainer.innerHTML = `
        <div class="status-container">
          <div class="status-icon">⚠️</div>
          <p>無法讀取 emapOpenDataAction.json 檔案<br><small style="color:#A09890;">（請確認檔案是否存在於同目錄，或透過 Local Server 開啟）</small></p>
          <button class="retry-btn" onclick="loadBookstores()">重新載入檔案</button>
        </div>
      `;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    searchInput.addEventListener('input', applyFilter);
    citySelect.addEventListener('change', applyFilter);
    randomBtn.addEventListener('click', triggerRandomStore);

    loadBookstores();
  </script>
</body>
</html>
